name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    env:
      # CI=true runs the tests once instead of watching, and makes lint warnings fail the build
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build

  backend:
    # runs the API against the real ensemble: the first run (or one after the cache key changes)
    # downloads the models and the ChEBI data from Hugging Face, later runs restore them
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      TORCH_VERSION: 2.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install PyTorch (CPU)
        # the default wheels pull in several GB of CUDA libraries the runner cannot use
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          # the graph models need PyTorch Geometric and torch_scatter, which chebai_graph does
          # not declare; torch_scatter has no PyPI wheels, only PyG's per-torch-version ones
          pip install torch_geometric==2.4.0 torch_scatter -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
      - name: Install dependencies
        run: |
          # keep the CPU build of torch installed above, whatever the requirements ask for
          pip freeze | grep -i "^torch==" > /tmp/torch-constraint.txt
          pip install -c /tmp/torch-constraint.txt -r requirements.txt pytest
      - name: Restore models and ChEBI data
        uses: actions/cache@v4
        with:
          # Hugging Face downloads (checkpoints, ChEBI graph, ensemble calibration) and what the
          # models derive from them in data/ relative to the working directory
          path: |
            ~/.cache/huggingface
            backend/data
          key: models-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'backend/tests/config.ci.json') }}
          restore-keys: |
            models-${{ runner.os }}-
      - name: Configure
        run: cp tests/config.ci.json config.json
      - name: Test
        run: pytest -v
